name: Gemini AI Code Review

on:
  pull_request:
    branches: [main]
  issues:
    types: [opened, edited]

jobs:
  review:
    name: Gemini Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Gemini CLI Review
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY is not set. Skipping Gemini code review."
            exit 0
          fi
          gemini /code-review || echo 'Gemini review failed, likely due to invalid API key. Skipping.'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
