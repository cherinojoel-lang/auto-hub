name: Notify on Jules PR
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  pull-requests: read
jobs:
  notify:
    if: contains(github.head_ref, 'jules')
    runs-on: ubuntu-latest
    steps:
      - name: Jules PR created
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: echo "Jules opened PR - $PR_URL"
