name: CI Checks

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline || npm install --no-fund --no-audit

    - name: Type Check
      run: npm run check || npx tsc --noEmit --skipLibCheck

    - name: Run Tests
      run: npm run test:run || npx vitest run
