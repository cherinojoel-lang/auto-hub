name: Cloudflare Preview

# Repository secrets are evaluated on each newly queued workflow run.
on:
  push:
    branches:
      - feat/aq-p0-foundation-2026-09-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Upload non-production Worker preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check and test
        run: |
          npm run check
          npm run test:run

      - name: Build Astro Worker
        run: npm run build

      - name: Verify secret context diagnostics
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY is available" || echo "GEMINI_API_KEY is unavailable"
          test -n "$CLOUDFLARE_API_TOKEN" && echo "CLOUDFLARE_API_TOKEN is available" || echo "CLOUDFLARE_API_TOKEN is unavailable"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && echo "CLOUDFLARE_ACCOUNT_ID is available" || echo "CLOUDFLARE_ACCOUNT_ID is unavailable"

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Upload preview version only
        run: npx wrangler versions upload --config dist/server/wrangler.json --preview-alias aq-preview
