name: Cloudflare Preview

# Every feature-branch push is verified first, then uploaded as a non-production
# version of the canonical Automobile Quick Worker. No production deployment occurs.
on:
  push:
    branches:
      - feat/aq-p0-foundation-2026-09-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Verify and upload owner-review preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check and test
        run: |
          npm run check
          npm run test:run

      - name: Build Astro Worker
        run: npm run build

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Upload owner-review preview version only
        run: npx wrangler versions upload --config dist/server/wrangler.json --preview-alias owner-review
