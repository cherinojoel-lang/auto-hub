name: Jules Security Agent
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            Security scan: find hardcoded secrets, XSS, auth gaps.
            Fix highest severity first. Keep changes under 100 lines.
            Run tests before creating PR.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
